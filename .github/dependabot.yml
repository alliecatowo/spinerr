# Weekly version updates. Minor and patch bumps are grouped into one PR and
# auto-merged by .github/workflows/dependabot-automerge.yml once required CI is
# green; major bumps arrive as separate PRs labelled `major-update`.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: npm
  directory: /web
  schedule:
    interval: weekly
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
  ignore:
  # Blocked upstream: eslint-plugin-react (pulled in by eslint-config-next)
  # crashes on ESLint 10 (jsx-eslint/eslint-plugin-react#3977). Remove once released.
  - dependency-name: eslint
    update-types: ["version-update:semver-major"]
  # Blocked upstream: typescript-eslint supports TypeScript <6.1 only
  # (typescript-eslint/typescript-eslint#10940). Remove once TS 7 is supported.
  - dependency-name: typescript
    update-types: ["version-update:semver-major"]
